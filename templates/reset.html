{% extends "base.html" %}
{% block content %}
<h1 style="color:red">⚠ Reset Database</h1>
<p>This will <strong>permanently delete all data</strong> — every user, document, run, and audit event — and recreate empty tables.</p>
<p>This cannot be undone.</p>

{% if error %}<p style="color:red">{{ error }}</p>{% endif %}

<form method="post" action="/ui/admin/reset">
    <label>Type <strong>RESET</strong> to confirm: <input type="text" name="confirm" required></label><br><br>
    <button type="submit" style="background:red; color:white;">Permanently Delete Everything</button>
</form>
{% endblock %}
