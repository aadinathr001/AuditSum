<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuditSum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2420;
    --ink-soft: #5C5248;
    --paper: #FAF6EE;
    --paper-raised: #F1EAD9;
    --rule: #D9CFB8;
    --accent: #7A3B2E;
    --accent-dark: #5C2A21;
    --accent-paper: #F4E6DE;
    --verified: #3F6B4A;
    --verified-bg: #E7EFE6;
    --unverified: #9C3B2E;
    --unverified-bg: #F6E6E0;
    --warn: #8A6A1F;
    --warn-bg: #F3EAD3;
    --radius: 3px;
    --font-serif: "Source Serif 4", Georgia, serif;
    --font-sans: "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--paper);
    margin: 0;
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
    margin: 0 0 0.5em 0;
  }

  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.25rem; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
  h2:first-of-type { margin-top: 1rem; border-top: none; padding-top: 0; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code, .mono { font-family: var(--font-mono); font-size: 0.9em; }

  /* ---- Header / Nav ---- */
  header.site {
    background: var(--ink);
    color: var(--paper);
    padding: 0;
    border-bottom: 3px solid var(--accent);
  }

  .site-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .brand {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--paper);
    padding: 16px 0;
    letter-spacing: 0.01em;
  }
  .brand::before { content: "§ "; color: var(--accent); opacity: 0.9; }

  nav.main { display: flex; gap: 4px; }
  nav.main a {
    color: #E7DECF;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: var(--radius);
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav.main a:hover { background: rgba(255,255,255,0.08); color: #fff; text-decoration: none; }

  /* ---- Layout ---- */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    animation: rise 0.25s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Cards / panels ---- */
  .panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
  }

  /* ---- Forms ---- */
  label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); margin-bottom: 4px; }
  input[type=email], input[type=password], input[type=text], input[type=file] {
    font-family: var(--font-sans);
    font-size: 0.95rem;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    max-width: 360px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-paper);
  }

  /* ---- Buttons ---- */
  button, .btn {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 0.9rem;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover, .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
  button:active, .btn:active { transform: translateY(0); }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .btn-danger { background: var(--unverified); }
  .btn-danger:hover { background: #7a2e22; }

  /* ---- Tables (ledger style) ---- */
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  th {
    font-family: var(--font-sans);
    font-weight: 600;
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--ink);
    padding: 8px 10px;
  }
  td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:hover td { background: var(--paper-raised); }

  /* ---- Status tags ---- */
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius);
    border-left: 3px solid currentColor;
  }
  .allow, .verified { color: var(--verified); background: var(--verified-bg); }
  .deny, .unverified { color: var(--unverified); background: var(--unverified-bg); }
  .flag, .redact, .pending_approval { color: var(--warn); background: var(--warn-bg); }
  td.allow, td.deny, td.flag, td.redact, td.verified, td.unverified,
  td.uploaded, td.denied, td.content_deleted {
    font-weight: 600;
  }
  td.allow::before, td.deny::before, td.flag::before, td.redact::before { content: none; }

  /* make outcome/status table cells read as tags */
  td.allow, td.verified { color: var(--verified); }
  td.deny, td.unverified, td.denied { color: var(--unverified); }
  td.flag, td.redact, td.pending_approval { color: var(--warn); }

  /* ---- Notices ---- */
  .notice {
    padding: 11px 16px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    margin-bottom: 16px;
    border-left: 3px solid;
  }
  .notice-info { background: var(--warn-bg); border-color: var(--warn); color: #5c4813; }
  .notice-error { background: var(--unverified-bg); border-color: var(--unverified); color: var(--unverified); }
  .notice-success { background: var(--verified-bg); border-color: var(--verified); color: var(--verified); }

  small { color: var(--ink-soft); }
</style>
</head>
<body>
<header class="site">
  <div class="site-inner">
    <span class="brand">AuditSum</span>
    <nav class="main">
      <a href="/ui/">Home</a>
      <a href="/ui/upload">Upload</a>
      {% set role = get_session_role(request) %}
      {% if role in ("admin", "auditor") %}
      <a href="/ui/audit">Auditor Console</a>
      {% endif %}
      {% if role == "admin" %}
      <a href="/ui/admin">Admin</a>
      {% endif %}
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
